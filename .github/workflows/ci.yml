
name: AI Task Management CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ai_task_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_task_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Download NLTK data
        run: |
          python -m nltk.downloader -d "$HOME/nltk_data" stopwords

      - name: Configure isolated test environment
        run: |
          cat > .env.test <<'EOF'
          TEST_DB_PASSWORD=ci_test_password
          SECRET_KEY=ci-only-test-secret-key-for-github-actions-123456
          EOF

      - name: Run verified unit tests
        run: |
          python -m pytest \
            tests/test_feature_loader.py \
            tests/test_prediction_batch_writer.py \
            -v

      - name: Validate Python syntax
        run: |
          python -m compileall -q api_elt_pipeline fastapi_backend airflow/dags
